name: Daily RS Rating

on:
  schedule:
    # 한국장 마감 후 (평일 한국시간 16:00 = UTC 07:00)
    - cron: '0 7 * * 1-5'
    # 미국장 마감 후 (평일 한국시간 다음날 06:00 = UTC 21:00)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: 라이브러리 설치
        run: |
          pip install pandas numpy finance-datareader tqdm

      - name: 한국 주식 계산
        run: python rs_rating_kr.py

      - name: 미국 주식 계산
        run: python rs_rating_us.py

      - name: 결과 파일 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kr_result.json us_result.json
          git commit -m "Update RS Rating data" || echo "No changes"
          git push
