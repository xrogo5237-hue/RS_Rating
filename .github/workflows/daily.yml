name: Daily RS Rating

on:
  schedule:
    - cron: '0 7 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: |
          pip install pandas numpy pykrx yfinance finance-datareader tqdm

      - name: 한국 주식 계산
        run: python RS_Rating_KR.py

      - name: 미국 주식 계산
        run: python RS_Rating_US.py

      - name: 결과 파일 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kr_result.json us_result.json
          git diff --staged --quiet || git commit -m "Update RS Rating data"
          git push
